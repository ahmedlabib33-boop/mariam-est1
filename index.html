/* Editorial scrim: dark, warm, with a theme tint + readable column */
body::after { content:""; position:fixed; inset:0; z-index:-2;
  background:
    radial-gradient(120% 90% at 78% 12%, rgba(0,0,0,0) 0%, rgba(14,12,22,0.35) 55%, rgba(10,8,16,0.72) 100%),
    linear-gradient(180deg, rgba(14,12,22,0.55) 0%, rgba(14,12,22,0.30) 30%, rgba(14,12,22,0.55) 100%),
    linear-gradient(100deg, var(--tint) 0%, rgba(14,12,22,0) 60%); }
@keyframes bgDrift { 0%{transform:scale(1.04) translateY(0);} 100%{transform:scale(1.10) translateY(-14px);} }
/* Soft light particles (bokeh) - subtle, professional */
.particles { position:fixed; inset:0; z-index:-1; pointer-events:none; overflow:hidden; }
.pt { position:absolute; bottom:-10vh; border-radius:50%;
  background:radial-gradient(circle at 30% 30%, rgba(255,245,220,0.9), rgba(255,215,150,0.15) 60%, transparent 70%);
  filter:blur(1px); opacity:0; animation:rise linear infinite; }
@keyframes rise { 0%{transform:translateY(0) scale(0.8); opacity:0;} 15%{opacity:0.55;} 85%{opacity:0.5;} 100%{transform:translateY(-120vh) scale(1.1); opacity:0;} }
.container { max-width:1000px; margin:0 auto; }
.header { background:rgba(255,255,255,0.90); backdrop-filter:blur(14px); border-radius:22px; padding:38px; margin-bottom:26px;
  box-shadow:0 24px 70px rgba(0,0,0,0.45); border:1px solid rgba(255,255,255,0.6); text-align:center; position:relative; overflow:hidden; }
.header::before{ content:""; position:absolute; top:0; left:0; right:0; height:4px; background:linear-gradient(90deg,var(--accent),#e9c46a,var(--accent)); }
.eyebrow{ letter-spacing:4px; text-transform:uppercase; font-size:0.72em; font-weight:600; color:var(--accent2); margin-bottom:6px; }
.header h1 { font-family:'Playfair Display',serif; color:#20233a; font-size:2.35em; line-height:1.1; margin-bottom:22px; }
.header h1 span{ color:var(--accent); }
.profile-section { display:flex; align-items:center; justify-content:center; gap:28px; margin-bottom:22px; flex-wrap:wrap; }
.profile-text { text-align:left; max-width:360px; }
.profile-text .name{ font-family:'Playfair Display',serif; color:var(--accent2); font-size:1.5em; margin-bottom:8px; }
.profile-text p { color:#44485c; line-height:1.6; margin:5px 0; font-size:1em; display:flex; align-items:center; gap:8px; }
.dot{ width:7px; height:7px; border-radius:50%; background:var(--accent); display:inline-block; flex-shrink:0; }
.avatar-wrap { position:relative; width:138px; height:138px; flex-shrink:0; }
.avatar-ring { position:absolute; inset:-5px; border-radius:50%;
  background:conic-gradient(from 140deg, var(--accent), #e9c46a, var(--accent2), var(--accent));
  animation:spin 14s linear infinite; }
.avatar-photo { position:absolute; inset:0; width:138px; height:138px; border-radius:50%; border:4px solid #fff;
  object-fit:cover; object-position:center 30%; box-shadow:0 10px 30px rgba(0,0,0,0.35); z-index:1; }
@keyframes spin { 100%{transform:rotate(360deg);} }
.subject-switch { display:flex; gap:12px; justify-content:center; margin:22px 0 8px; flex-wrap:wrap; }
.switch-btn { padding:13px 32px; border:1.5px solid var(--accent); border-radius:40px; background:transparent; color:var(--accent2);
  font-size:1em; font-weight:600; cursor:pointer; transition:all 0.25s ease; letter-spacing:0.5px; }
.switch-btn.active { background:var(--accent); color:white; box-shadow:0 8px 22px var(--tint); }
.switch-btn:hover { transform:translateY(-1px); }
.test-info { margin-top:18px; color:#55596e; font-size:0.95em; }
.test-info strong{ color:var(--accent2); }
.quiz-container { background:rgba(255,255,255,0.93); backdrop-filter:blur(14px); border-radius:20px; padding:38px;
  box-shadow:0 24px 70px rgba(0,0,0,0.45); border:1px solid rgba(255,255,255,0.6); margin-bottom:22px; }
.progress-bar { width:100%; height:8px; background:#e8e8ef; border-radius:10px; margin-bottom:28px; overflow:hidden; }
.progress-fill { height:100%; background:linear-gradient(90deg,var(--accent),var(--accent2)); width:0%; transition:width 0.3s ease; }
.lesson-card { margin-bottom:34px; padding:26px; background:#fbfbff; border-radius:14px; border:1px solid #ececf5;
  border-left:5px solid var(--accent); box-shadow:0 6px 20px rgba(20,20,45,0.05); }
.lesson-title { font-family:'Playfair Display',serif; font-size:1.3em; font-weight:700; color:#23263d; margin-bottom:16px; }
.rule-title { font-weight:700; color:#9a7b1e; margin-bottom:6px; font-size:0.95em; letter-spacing:0.3px; }
.rule-text { background:#fffdf4; border:1px solid #f0e6c8; border-left:4px solid #e9c46a; padding:14px 16px; border-radius:8px;
  margin-bottom:16px; color:#5a4d22; line-height:1.65; }
.example-title { font-weight:700; color:var(--accent2); margin-bottom:6px; font-size:0.95em; letter-spacing:0.3px; }
.example-text { background:var(--tint); border-left:4px solid var(--accent); padding:14px 16px; border-radius:8px;
  margin-bottom:22px; color:#2c2f45; line-height:1.65; font-weight:500; }
.practice-head { font-weight:700; color:#23263d; margin:8px 0 16px; font-size:1.02em; border-top:1px solid #ececf5; padding-top:16px; }
.mcq { margin-bottom:22px; }
.mcq-q { font-weight:600; color:#23263d; margin-bottom:12px; font-size:1.05em; }
.options { display:grid; gap:10px; }
.option { padding:14px 16px; border:1.5px solid #e3e3ee; border-radius:10px; cursor:pointer; transition:all 0.22s ease; background:white; font-size:1em; }
.option:hover { border-color:var(--accent); background:var(--tint); }
.option input { margin-right:10px; cursor:pointer; accent-color:var(--accent); }
.feedback { padding:13px 16px; border-radius:10px; margin-top:12px; display:none; }
.feedback.show { display:block; }
.feedback.correct { background:#e7f7ec; border:1px solid #9fdcb2; color:#166534; }
.feedback.incorrect { background:#fdeaea; border:1px solid #f3b4b4; color:#9b1c1c; }
.feedback-message { font-size:1.1em; font-weight:700; }
.submit-btn,.reset-btn { background:linear-gradient(135deg,var(--accent),var(--accent2)); color:white; padding:15px 40px; border:none;
  border-radius:12px; font-size:1.05em; font-weight:700; cursor:pointer; width:100%; margin-top:18px; transition:transform 0.2s ease; letter-spacing:0.4px; }
.submit-btn:hover,.reset-btn:hover { transform:translateY(-2px); box-shadow:0 14px 34px var(--tint); }
.results-section { background:rgba(255,255,255,0.95); backdrop-filter:blur(14px); border-radius:20px; padding:40px;
  box-shadow:0 24px 70px rgba(0,0,0,0.45); border:1px solid rgba(255,255,255,0.6); text-align:center; display:none; }
.results-section.show { display:block; }
.results-section h2{ font-family:'Playfair Display',serif; color:#23263d; }
.score-display { font-family:'Playfair Display',serif; font-size:3em; font-weight:700; color:var(--accent); margin:18px 0; }
.score-message { font-size:1.25em; color:#44485c; margin:16px 0; }
@media (max-width:768px){ .header h1{font-size:1.7em;} .profile-section{flex-direction:column;gap:18px;} .profile-text{text-align:center;} .profile-text p{justify-content:center;} .score-display{font-size:2.2em;} .switch-btn{padding:11px 24px;} }
</style>
</head>

      <button class="switch-btn" id="btnMath" onclick="switchSubject('math')">Math</button>
    </div>
    <div class="test-info">Learn the <strong>Rule</strong> &#8594; study an <strong>Example</strong> &#8594; solve <strong>2 questions</strong> per lesson</div>
  </div>
  <div class="quiz-container" id="quizContainer">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div id="lessonsArea"></div>
    <button class="submit-btn" onclick="submitQuiz()">Submit Answers &amp; See Results</button>
  </div>
  <div class="results-section" id="resultsSection">
    <h2>Your Results</h2>
    <div class="score-display" id="scoreDisplay">0/12</div>
    <div class="score-message" id="scoreMessage"></div>
    <button class="reset-btn" onclick="resetQuiz()">Try Again</button>
  </div>
</div>
<script>
const englishLessons = [{"title": "1) Subject–Verb Agreement", "rule": "The verb must match the subject. Singular subject → singular verb; plural subject → plural verb. Tricky words like everybody, everyone, each, neither, nobody are ALWAYS singular → they take 'is / has / does'.", "example": "Everybody IS happy (not 'are'). She HAS a car (not 'have'). Neither answer IS correct.", "mcqs": [{"q": "Neither of the boys ___ here.", "options": ["is", "are", "were", "have"], "correct": 0}, {"q": "Each student ___ a book.", "options": ["has", "have", "are", "having"], "correct": 0}]}, {"title": "2) Present Perfect (have / has + past participle)", "rule": "Use present perfect for an action that started in the past and still matters now. Form: have/has + past participle. Use 'has' with he/she/it; use 'have' with I/you/we/they.", "example": "She HAS worked here for 5 years. They HAVE finished the project.", "mcqs": [{"q": "He ___ already eaten.", "options": ["has", "have", "is", "will"], "correct": 0}, {"q": "They ___ lived here since 2010.", "options": ["have", "has", "is", "was"], "correct": 0}]}, {"title": "3) Conditionals (If … were … would)", "rule": "For an unreal or imaginary situation, use 'were' for EVERY subject (even I, he, she), and 'would + verb' in the result. Form: If + were …, … would + verb.", "example": "If I WERE you, I WOULD take the job. (not 'was')  If she WERE here, she WOULD help.", "mcqs": [{"q": "If she ___ rich, she would travel.", "options": ["were", "was", "is", "be"], "correct": 0}, {"q": "If I ___ taller, I would play basketball.", "options": ["were", "was", "am", "be"], "correct": 0}]}, {"title": "4) Prepositions (fixed pairs)", "rule": "Some words always take a fixed preposition. Learn them as pairs: good AT, interested IN, afraid OF, in spite OF. Careful: 'despite' takes NO 'of'.", "example": "She is good AT math. I'm interested IN science. In spite OF the rain, we went (✓). Despite the rain (✓, no 'of').", "mcqs": [{"q": "She is good ___ math.", "options": ["at", "in", "on", "with"], "correct": 0}, {"q": "I'm interested ___ science.", "options": ["in", "at", "on", "of"], "correct": 0}]}, {"title": "5) Word Forms (noun / adjective / adverb)", "rule": "Use the right form for the slot. After 'is/am/are' use an ADJECTIVE (successful). To describe HOW a verb happens, use an ADVERB (usually -ly: quickly). The thing itself is a NOUN (success).", "example": "She is SUCCESSFUL (adjective). She works QUICKLY (adverb). Her SUCCESS is clear (noun).", "mcqs": [{"q": "He drives very ___.", "options": ["carefully", "careful", "care", "cares"], "correct": 0}, {"q": "She is a ___ dancer.", "options": ["beautiful", "beautifully", "beauty", "beautify"], "correct": 0}]}, {"title": "6) Vocabulary (meaning & synonyms)", "rule": "Pick the word closest in meaning; use the sentence for clues. Useful words: ambiguous = unclear, meticulous = very careful, pragmatic = practical.", "example": "'The plan was ambiguous' = the plan was UNCLEAR. 'A meticulous worker' = a very CAREFUL worker.", "mcqs": [{"q": "'Meticulous' means ___.", "options": ["very careful", "very fast", "very lazy", "very rich"], "correct": 0}, {"q": "A synonym of 'happy' is ___.", "options": ["joyful", "angry", "tired", "afraid"], "correct": 0}]}];
const mathLessons = [{"title": "1) Linear Equations (one unknown)", "rule": "A linear equation has x to the power 1 (no x²). Golden rule: do the SAME thing to both sides. To get x alone, first move plain numbers to the other side (a + becomes −, a − becomes +), then divide by the number multiplying x.", "example": "Solve 2x + 5 = 15 → move +5 across: 2x = 15 − 5 = 10 → divide by 2: x = 10 ÷ 2 = 5.  Check: 2(5)+5 = 15 ✓", "mcqs": [{"q": "Solve:  3x − 6 = 9", "options": ["x = 5", "x = 1", "x = 3", "x = 45"], "correct": 0}, {"q": "Solve:  4x + 2 = 14", "options": ["x = 3", "x = 4", "x = 6", "x = 16"], "correct": 0}]}, {"title": "2) Equations with Brackets", "rule": "Open the bracket FIRST: multiply everything inside by the number outside. Then solve like a normal linear equation (numbers across, then divide).", "example": "Solve 2(x + 3) = 16 → multiply out: 2x + 6 = 16 → 2x = 10 → x = 5.  Check: 2(5+3)=16 ✓", "mcqs": [{"q": "Solve:  3(x − 1) = 12", "options": ["x = 5", "x = 3", "x = 4", "x = 11"], "correct": 0}, {"q": "Solve:  2(2x + 1) = 18", "options": ["x = 4", "x = 8", "x = 5", "x = 9"], "correct": 0}]}, {"title": "3) Quadratic Equations — Factoring (the smart way)", "rule": "A quadratic has x². To solve x² + bx + c = 0, find TWO numbers that MULTIPLY to c and ADD to b. Write them as (x + first)(x + second) = 0. Then set each bracket to 0 — each gives one answer.", "example": "Solve x² − 5x + 6 = 0 → need two numbers that multiply to +6 and add to −5 → that is −2 and −3 (−2 × −3 = 6, and −2 + −3 = −5). So (x − 2)(x − 3) = 0 → x − 2 = 0 OR x − 3 = 0 → x = 2 or x = 3.", "mcqs": [{"q": "Solve:  x² − 7x + 12 = 0", "options": ["x = 3 or 4", "x = −3 or −4", "x = 2 or 6", "x = 1 or 12"], "correct": 0}, {"q": "Solve:  x² + 5x + 6 = 0", "options": ["x = −2 or −3", "x = 2 or 3", "x = −1 or −6", "x = 6 or 1"], "correct": 0}]}, {"title": "4) Substitution", "rule": "Substitution means replacing a letter with its known value, then solving. Wherever you see that letter, put the number in its place (use brackets), then do the arithmetic.", "example": "If 3x + 2y = 12 and x = 2 → put 2 for x: 3(2) + 2y = 12 → 6 + 2y = 12 → 2y = 6 → y = 3.", "mcqs": [{"q": "If  y = 2x + 1  and  x = 3, find y", "options": ["y = 7", "y = 6", "y = 5", "y = 9"], "correct": 0}, {"q": "If  2x + y = 10  and  x = 4, find y", "options": ["y = 2", "y = 6", "y = 4", "y = 18"], "correct": 0}]}, {"title": "5) Powers (Exponents)", "rule": "aˣ = N means 'a multiplied by itself x times equals N'. To find x, rewrite N as a power of a, then the exponents must match.", "example": "Solve 2ˣ = 8 → write 8 as a power of 2: 8 = 2 × 2 × 2 = 2³ → so x = 3.", "mcqs": [{"q": "Solve:  3ˣ = 27", "options": ["x = 3", "x = 9", "x = 2", "x = 4"], "correct": 0}, {"q": "Solve:  2ˣ = 16", "options": ["x = 4", "x = 8", "x = 2", "x = 3"], "correct": 0}]}, {"title": "6) Square Roots", "rule": "√x asks 'what number times itself gives x'. To undo a square root, SQUARE both sides. To solve x² = k, take ±√k — remember there are TWO answers (positive and negative).", "example": "Solve √x = 6 → square both sides: x = 6² = 36.  And x² = 49 → x = ±√49 = ±7.", "mcqs": [{"q": "Solve:  √x = 5", "options": ["x = 25", "x = 10", "x = 2.5", "x = 125"], "correct": 0}, {"q": "Solve:  x² = 36", "options": ["x = ±6", "x = 6 only", "x = ±18", "x = 1296"], "correct": 0}]}];
let currentSubject='english';
let lessons = englishLessons;
let userAnswers = {};
function totalMcqs(){ let t=0; lessons.forEach(l=>t+=l.mcqs.length); return t; }
function switchSubject(sub){
  currentSubject=sub;
  lessons = (sub==='math') ? mathLessons : englishLessons;
  document.body.className = (sub==='math') ? 'math-theme' : 'english-theme';
  document.getElementById('btnEnglish').classList.toggle('active', sub==='english');
  document.getElementById('btnMath').classList.toggle('active', sub==='math');
  resetQuiz();
}
function initializeQuiz(){
  const area=document.getElementById('lessonsArea'); area.innerHTML='';
  lessons.forEach((lesson, li)=>{
    const card=document.createElement('div'); card.className='lesson-card';
    let mcqHTML='';
    lesson.mcqs.forEach((mcq, qi)=>{
      let opts='';
      mcq.options.forEach((o, oi)=>{ opts+=`<label class="option"><input type="radio" name="q_${li}_${qi}" value="${oi}" onchange="selectAnswer('${li}_${qi}', ${oi})"> ${o}</label>`; });
      mcqHTML+=`<div class="mcq"><div class="mcq-q">Q${qi+1}. ${mcq.q}</div><div class="options">${opts}</div><div class="feedback" id="fb_${li}_${qi}"></div></div>`;
    });
    card.innerHTML=`<div class="lesson-title">${lesson.title}</div>
      <div class="rule-title">THE RULE &amp; SMART EXPLANATION</div>
      <div class="rule-text">${lesson.rule}</div>
      <div class="example-title">EXAMPLE</div>
      <div class="example-text">${lesson.example}</div>
      <div class="practice-head">Now solve these 2 questions:</div>${mcqHTML}`;
    area.appendChild(card);
  });
  updateProgress();
}
function selectAnswer(key, idx){ userAnswers[key]=idx; updateProgress(); }
function updateProgress(){ const a=Object.keys(userAnswers).length; document.getElementById('progressFill').style.width=(a/totalMcqs()*100)+'%'; }
function submitQuiz(){
  let score=0;
  lessons.forEach((lesson, li)=>{ lesson.mcqs.forEach((mcq, qi)=>{
    const key=li+'_'+qi; const fb=document.getElementById('fb_'+key); fb.classList.add('show');
    if(userAnswers[key]===mcq.correct){ score++; fb.className='feedback show correct'; fb.innerHTML='<div class="feedback-message">&#9989; GO GO MARIE! &#127881;</div>'; }
    else { fb.className='feedback show incorrect'; fb.innerHTML='<div class="feedback-message">&#10060; PLZ MIRO NO</div><div>Correct answer: <strong>'+mcq.options[mcq.correct]+'</strong></div>'; }
  }); });
  document.getElementById('quizContainer').style.display='none';
  document.getElementById('resultsSection').classList.add('show');
  const total=totalMcqs(); document.getElementById('scoreDisplay').textContent=score+'/'+total;
  const pct=score/total*100; let msg;
  if(pct===100) msg='&#127775; Perfect score &#8212; outstanding work, Mariam!';
  else if(pct>=75) msg='&#127942; Excellent &#8212; keep up the momentum!';
  else if(pct>=50) msg='Good start &#8212; review the rules and try again.';
  else msg='Read each Rule &amp; Example again, then retry.';
  document.getElementById('scoreMessage').innerHTML=msg+' ('+pct.toFixed(0)+'%)';
  window.scrollTo({top:0,behavior:'smooth'});
}
function resetQuiz(){ userAnswers={}; document.getElementById('quizContainer').style.display='block'; document.getElementById('resultsSection').classList.remove('show'); document.getElementById('progressFill').style.width='0%'; initializeQuiz(); }
(function(){ const box=document.getElementById('particles');
  for(let i=0;i<16;i++){ const s=document.createElement('span'); s.className='pt';
    const sz=6+Math.random()*16; s.style.width=sz+'px'; s.style.height=sz+'px';
    s.style.left=Math.random()*100+'vw'; const d=14+Math.random()*16;
    s.style.animationDuration=d+'s'; s.style.animationDelay=(-Math.random()*d)+'s'; box.appendChild(s); } })();
initializeQuiz();
</script>
</body>
</html>
