<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mariam's EST1 Lessons - English & Math</title>
<meta name="description" content="EST1 preparation for Mariam: English and Math lessons using Rule -> Example -> Practice, with instant-feedback practice questions.">

<meta property="og:title" content="Mariam's EST1 Lessons - English &amp; Math">
<meta property="og:description" content="Rule -> Example -> Practice lessons for EST1, with instant feedback and scoring.">

<link rel="apple-touch-icon" href="/avatar.webp">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root{ --accent:#6d5bd0; --accent2:#4b3fb0; --tint:rgba(109,91,208,0.26); }
body { font-family:'Inter',system-ui,sans-serif; min-height:100vh; padding:28px 20px; position:relative; overflow-x:hidden; color:#1d2030; background:#1b1a2e; }
body.english-theme { --accent:#6d5bd0; --accent2:#4b3fb0; --tint:rgba(109,91,208,0.26); }
body.math-theme { --accent:#0f9d8e; --accent2:#0a776b; --tint:rgba(15,157,142,0.26); }
body::after { content:""; position:fixed; inset:0; z-index:-2;
  background:
    radial-gradient(120% 90% at 78% 12%, rgba(0,0,0,0) 0%, rgba(14,12,22,0.35) 55%, rgba(10,8,16,0.72) 100%),
    linear-gradient(100deg, var(--tint) 0%, rgba(14,12,22,0) 60%); }
.container { max-width:1000px; margin:0 auto; }
.header { background:rgba(255,255,255,0.93); backdrop-filter:blur(14px); border-radius:22px; padding:34px; margin-bottom:24px;
  box-shadow:0 24px 70px rgba(0,0,0,0.45); text-align:center; position:relative; overflow:hidden; }
.header::before{ content:""; position:absolute; top:0; left:0; right:0; height:4px; background:linear-gradient(90deg,var(--accent),#e9c46a,var(--accent)); }
.eyebrow{ letter-spacing:4px; text-transform:uppercase; font-size:0.72em; font-weight:600; color:var(--accent2); margin-bottom:6px; }
.header h1 { font-family:'Playfair Display',serif; color:#20233a; font-size:2.2em; line-height:1.1; margin-bottom:14px; }
.header h1 span{ color:var(--accent); }
.student { color:#44485c; font-size:1em; margin-bottom:16px; }
.student strong{ color:var(--accent2); }
.subject-switch { display:flex; gap:10px; justify-content:center; margin:12px 0 10px; flex-wrap:wrap; }
.switch-btn { padding:11px 26px; border:1.5px solid var(--accent); border-radius:40px; background:transparent; color:var(--accent2);
  font-size:0.98em; font-weight:600; cursor:pointer; transition:all 0.25s ease; }
.switch-btn.active { background:var(--accent); color:white; box-shadow:0 8px 22px var(--tint); }
.section-tabs { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-top:10px; }
.section-tab { padding:8px 16px; border:1px solid #d6d6e6; border-radius:30px; background:#fff; color:#44485c; font-size:0.88em; cursor:pointer; }
.section-tab.active { background:#23263d; color:#fff; border-color:#23263d; }
.test-info { margin-top:14px; color:#55596e; font-size:0.93em; }
.test-info strong{ color:var(--accent2); }
.quiz-container { background:rgba(255,255,255,0.95); border-radius:20px; padding:34px; box-shadow:0 24px 70px rgba(0,0,0,0.45); margin-bottom:22px; }
.progress-bar { width:100%; height:8px; background:#e8e8ef; border-radius:10px; margin-bottom:10px; overflow:hidden; }
.progress-fill { height:100%; background:linear-gradient(90deg,var(--accent),var(--accent2)); width:0%; transition:width 0.3s ease; }
.progress-label { font-size:0.85em; color:#55596e; margin-bottom:24px; }
.lesson-card { margin-bottom:30px; padding:24px; background:#fbfbff; border-radius:14px; border:1px solid #ececf5; border-left:5px solid var(--accent); }
.lesson-title { font-family:'Playfair Display',serif; font-size:1.25em; font-weight:700; color:#23263d; margin-bottom:14px; }
.lesson-section { font-size:0.8em; color:var(--accent2); text-transform:uppercase; letter-spacing:1px; margin-bottom:10px; }
.rule-title { font-weight:700; color:#9a7b1e; margin-bottom:6px; font-size:0.93em; }
.rule-text { background:#fffdf4; border:1px solid #f0e6c8; border-left:4px solid #e9c46a; padding:13px 15px; border-radius:8px; margin-bottom:14px; color:#5a4d22; line-height:1.65; }
.example-title { font-weight:700; color:var(--accent2); margin-bottom:6px; font-size:0.93em; }
.example-text { background:var(--tint); border-left:4px solid var(--accent); padding:13px 15px; border-radius:8px; margin-bottom:20px; color:#2c2f45; line-height:1.65; font-weight:500; white-space:pre-line; }
.practice-head { font-weight:700; color:#23263d; margin:8px 0 14px; font-size:1em; border-top:1px solid #ececf5; padding-top:14px; }
.mcq { margin-bottom:20px; }
.mcq-q { font-weight:600; color:#23263d; margin-bottom:10px; font-size:1.02em; white-space:pre-line; }
.options { display:grid; gap:9px; }
.option { padding:12px 15px; border:1.5px solid #e3e3ee; border-radius:10px; cursor:pointer; transition:all 0.22s ease; background:white; }
.option:hover { border-color:var(--accent); background:var(--tint); }
.option input { margin-right:10px; accent-color:var(--accent); }
.feedback { padding:12px 15px; border-radius:10px; margin-top:10px; display:none; }
.feedback.show { display:block; }
.feedback.correct { background:#e7f7ec; border:1px solid #9fdcb2; color:#166534; }
.feedback.incorrect { background:#fdeaea; border:1px solid #f3b4b4; color:#9b1c1c; }
.feedback-message { font-size:1.05em; font-weight:700; }
.submit-btn,.reset-btn { background:linear-gradient(135deg,var(--accent),var(--accent2)); color:white; padding:14px 36px; border:none;
  border-radius:12px; font-size:1.02em; font-weight:700; cursor:pointer; width:100%; margin-top:16px; transition:transform 0.2s ease; }
.submit-btn:hover,.reset-btn:hover { transform:translateY(-2px); }
.results-section { background:rgba(255,255,255,0.96); border-radius:20px; padding:36px; box-shadow:0 24px 70px rgba(0,0,0,0.45); text-align:center; display:none; }
.results-section.show { display:block; }
.results-section h2{ font-family:'Playfair Display',serif; color:#23263d; }
.score-display { font-family:'Playfair Display',serif; font-size:3em; font-weight:700; color:var(--accent); margin:16px 0; }
.score-message { font-size:1.15em; color:#44485c; margin:14px 0; }
.breakdown { text-align:left; margin:18px 0; }
.breakdown-row { display:flex; justify-content:space-between; padding:10px 14px; border-bottom:1px solid #ececf5; font-size:0.95em; }
.breakdown-row .bar { color:var(--accent2); font-weight:600; }
@media (max-width:768px){ .header h1{font-size:1.6em;} .score-display{font-size:2.2em;} .switch-btn{padding:10px 20px;} .quiz-container{padding:22px;} }

/* ============================================================
   ANIMATION LAYER
   ============================================================ */
@keyframes fadeUp    { from{opacity:0; transform:translateY(24px);} to{opacity:1; transform:none;} }
@keyframes dropIn    { from{opacity:0; transform:translateY(-28px) scale(.97);} to{opacity:1; transform:none;} }
@keyframes floatBob  { 0%,100%{transform:translateY(0) rotate(-2deg);} 50%{transform:translateY(-13px) rotate(2deg);} }
@keyframes haloPulse { 0%,100%{transform:scale(1); opacity:.75;} 50%{transform:scale(1.18); opacity:.25;} }
@keyframes slideGrad { 0%{background-position:0% 50%;} 100%{background-position:200% 50%;} }
@keyframes shimmer   { 0%{transform:translateX(-140%);} 100%{transform:translateX(360%);} }
@keyframes popIn     { 0%{transform:scale(.65); opacity:0;} 60%{transform:scale(1.07);} 100%{transform:scale(1); opacity:1;} }
@keyframes shake     { 10%,90%{transform:translateX(-2px);} 20%,80%{transform:translateX(4px);}
                       30%,50%,70%{transform:translateX(-7px);} 40%,60%{transform:translateX(7px);} }
@keyframes drift     { from{transform:translateY(0) rotate(0deg);}  to{transform:translateY(-118vh) rotate(400deg);} }
@keyframes spin360   { to{transform:rotate(360deg);} }
@keyframes readyGlow { 0%,100%{box-shadow:0 0 0 0 var(--tint);} 50%{box-shadow:0 0 0 12px rgba(255,255,255,0);} }

/* page entrance */
.header         { animation:dropIn .75s cubic-bezier(.22,1,.36,1) both; }
.quiz-container { animation:fadeUp .75s cubic-bezier(.22,1,.36,1) .12s both; }

/* animated rule across the top of the header */
.header::before { background:linear-gradient(90deg,var(--accent),#e9c46a,var(--accent),#e9c46a,var(--accent));
                  background-size:200% 100%; animation:slideGrad 7s linear infinite; }

/* avatar */
.avatar-wrap { position:relative; display:flex; justify-content:center; align-items:center;
               height:130px; margin-bottom:8px; }
.avatar-glow { position:absolute; width:118px; height:118px; border-radius:50%;
               background:radial-gradient(circle, var(--accent) 0%, transparent 70%);
               animation:haloPulse 3.4s ease-in-out infinite; }
.avatar      { position:relative; width:124px; height:124px; border-radius:50%; object-fit:cover;
               border:4px solid #fff; box-shadow:0 16px 38px rgba(0,0,0,.32); background:var(--tint);
               animation:floatBob 5.5s ease-in-out infinite; cursor:pointer;
               transition:transform .4s cubic-bezier(.34,1.56,.64,1), box-shadow .3s ease; }
.avatar:hover{ transform:scale(1.08) rotate(3deg); box-shadow:0 20px 46px var(--tint); }
.avatar.spin { animation:spin360 .85s cubic-bezier(.5,0,.5,1); }

/* subject + section buttons */
.switch-btn         { transition:all .28s cubic-bezier(.34,1.56,.64,1); }
.switch-btn:hover   { transform:translateY(-2px); box-shadow:0 8px 18px var(--tint); }
.switch-btn.active  { animation:popIn .38s cubic-bezier(.34,1.56,.64,1); }
.section-tab        { transition:all .22s ease; }
.section-tab:hover  { transform:translateY(-2px); border-color:var(--accent); color:var(--accent2); }
.section-tab.active { animation:popIn .32s cubic-bezier(.34,1.56,.64,1); }

/* progress bar shimmer */
.progress-fill       { position:relative; overflow:hidden; }
.progress-fill::after{ content:""; position:absolute; top:0; bottom:0; left:0; width:38%;
                       background:linear-gradient(90deg,transparent,rgba(255,255,255,.8),transparent);
                       animation:shimmer 2s linear infinite; }

/* lesson cards reveal as they scroll into view */
.lesson-card          { opacity:0; transform:translateY(24px);
                        transition:opacity .6s ease, transform .6s cubic-bezier(.22,1,.36,1),
                                   box-shadow .3s ease, border-left-width .25s ease; }
.lesson-card.revealed { opacity:1; transform:none; }
.lesson-card.revealed:hover { box-shadow:0 14px 34px rgba(0,0,0,.10); border-left-width:9px; }

/* answer options */
.option         { transition:all .22s cubic-bezier(.34,1.56,.64,1); }
.option:hover   { transform:translateX(6px); box-shadow:0 6px 16px var(--tint); }
.option.chosen  { border-color:var(--accent); background:var(--tint); font-weight:600;
                  animation:popIn .32s cubic-bezier(.34,1.56,.64,1); }

/* feedback */
.feedback.show           { animation:popIn .38s cubic-bezier(.34,1.56,.64,1); }
.feedback.incorrect.show { animation:shake .5s ease; }

/* buttons */
.submit-btn, .reset-btn { background-size:200% 100%;
                          transition:transform .2s ease, box-shadow .3s ease; }
.submit-btn:hover, .reset-btn:hover { animation:slideGrad 2.2s linear infinite;
                          box-shadow:0 14px 30px var(--tint); }
.submit-btn:active, .reset-btn:active { transform:translateY(1px) scale(.99); }
.submit-btn.ready       { animation:readyGlow 1.9s ease-in-out infinite; }

/* results */
.results-section.show { animation:fadeUp .65s cubic-bezier(.22,1,.36,1) both; }
.score-display        { animation:popIn .7s cubic-bezier(.34,1.56,.64,1) both; }
.breakdown-row        { opacity:0; animation:fadeUp .5s ease forwards; transition:background .2s ease; }
.breakdown-row:hover  { background:var(--tint); border-radius:8px; }

/* hearts, stars and flowers drifting up behind the content */
.decor      { position:fixed; inset:0; z-index:-1; pointer-events:none; overflow:hidden; }
.decor span { position:absolute; bottom:-90px; opacity:0; animation:drift linear infinite;
              filter:drop-shadow(0 4px 10px rgba(0,0,0,.28)); will-change:transform; }

@media (max-width:768px){
  .avatar-wrap{ height:108px; } .avatar{ width:100px; height:100px; }
  .avatar-glow{ width:96px; height:96px; }
}

/* respect the OS "reduce motion" setting */
@media (prefers-reduced-motion:reduce){
  *, *::before, *::after { animation:none !important; transition-duration:.01ms !important; }
  .lesson-card { opacity:1 !important; transform:none !important; }
  .decor { display:none; }
}
</style>
</head>
<body class="english-theme">
<div class="decor" id="decor" aria-hidden="true"></div>
<div class="container">
  <div class="header">
    <div class="avatar-wrap">
      <span class="avatar-glow"></span>
      <img class="avatar" src="/avatar.webp" alt="Mariam" width="124" height="124" onclick="spinAvatar(this)">
    </div>
    <div class="eyebrow">EST1 Preparation</div>
    <h1>Mariam&#39;s <span>Study Lessons</span></h1>
    <div class="student">Ambitious &amp; focused learner &middot; Method: <strong>Rule &#8594; Example &#8594; Practice</strong></div>
    <div class="subject-switch">
      <button class="switch-btn active" id="btnEnglish" onclick="switchSubject('english')">English</button>
      <button class="switch-btn" id="btnMath" onclick="switchSubject('math')">Math</button>
    </div>
    <div class="section-tabs" id="sectionTabs"></div>
    <div class="test-info">Learn the <strong>Rule</strong> &#8594; study the <strong>Example</strong> &#8594; solve <strong>practice questions</strong> per lesson</div>
  </div>
  <div class="quiz-container" id="quizContainer">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-label" id="progressLabel">0 of 0 answered</div>
    <div id="lessonsArea"></div>
    <button class="submit-btn" onclick="submitQuiz()">Submit Answers &amp; See Results</button>
  </div>
  <div class="results-section" id="resultsSection">
    <h2>Your Results</h2>
    <div class="score-display" id="scoreDisplay">0/0</div>
    <div class="score-message" id="scoreMessage"></div>
    <div class="breakdown" id="breakdown"></div>
    <button class="reset-btn" onclick="resetQuiz()">Try Again</button>
  </div>
</div>

<script>
/* ============================================================
   CONTENT
   Each section: { name, lessons: [ { title, rule, example, mcqs:[{q, options, correct}] } ] }
   Every lesson has 4 practice questions.
   ============================================================ */

const englishSections = [
  {
    name: "Grammar",
    lessons: [
      { title: "1) Subject–Verb Agreement",
        rule: "The verb must match the subject. Singular subject → singular verb; plural subject → plural verb. Words like everybody, everyone, each, neither, nobody are ALWAYS singular → they take 'is / has / does'.",
        example: "Everybody IS happy (not 'are'). She HAS a car (not 'have'). Neither answer IS correct.",
        mcqs: [
          { q: "Neither of the boys ___ here.", options: ["is","are","were","have"], correct: 0 },
          { q: "Each student ___ a book.", options: ["has","have","are","having"], correct: 0 },
          { q: "The team ___ winning every game this season.", options: ["is","are","were","have"], correct: 0 },
          { q: "Everyone in the classes ___ the test yesterday.", options: ["took","take","taking","takes"], correct: 0 } ] },
      { title: "2) Present Perfect (have / has + past participle)",
        rule: "Use present perfect for an action that started in the past and still matters now. Form: have/has + past participle. 'has' with he/she/it; 'have' with I/you/we/they.",
        example: "She HAS worked here for 5 years. They HAVE finished the project.",
        mcqs: [
          { q: "He ___ already eaten.", options: ["has","have","is","will"], correct: 0 },
          { q: "They ___ lived here since 2010.", options: ["have","has","is","was"], correct: 0 },
          { q: "I ___ never seen that movie.", options: ["have","has","had","am"], correct: 0 },
          { q: "She ___ written three letters this week.", options: ["has","have","is","was"], correct: 0 } ] },
      { title: "3) Conditionals (If … were … would)",
        rule: "For an unreal or imaginary situation, use 'were' for EVERY subject, and 'would + verb' in the result. Form: If + were …, … would + verb.",
        example: "If I WERE you, I WOULD take the job. (not 'was')  If she WERE here, she WOULD help.",
        mcqs: [
          { q: "If she ___ rich, she would travel.", options: ["were","was","is","be"], correct: 0 },
          { q: "If I ___ taller, I would play basketball.", options: ["were","was","am","be"], correct: 0 },
          { q: "If we ___ more time, we would finish the project.", options: ["had","have","has","would have"], correct: 0 },
          { q: "If it ___ sunny, we would go to the beach.", options: ["were","was","is","be"], correct: 0 } ] },
      { title: "4) Prepositions (fixed pairs)",
        rule: "Some words always take a fixed preposition. Learn them as pairs: good AT, interested IN, afraid OF, in spite OF. 'Despite' takes NO 'of'.",
        example: "She is good AT math. I'm interested IN science. In spite OF the rain (✓). Despite the rain (✓, no 'of').",
        mcqs: [
          { q: "She is good ___ math.", options: ["at","in","on","with"], correct: 0 },
          { q: "I'm interested ___ science.", options: ["in","at","on","of"], correct: 0 },
          { q: "He is afraid ___ dogs.", options: ["of","at","for","with"], correct: 0 },
          { q: "We arrived ___ time for the exam.", options: ["on","in","at","by"], correct: 0 } ] },
      { title: "5) Word Forms (noun / adjective / adverb)",
        rule: "After 'is/am/are' use an ADJECTIVE. To describe HOW a verb happens, use an ADVERB (usually -ly). The thing itself is a NOUN.",
        example: "She is SUCCESSFUL (adjective). She works QUICKLY (adverb). Her SUCCESS is clear (noun).",
        mcqs: [
          { q: "He drives very ___.", options: ["carefully","careful","care","cares"], correct: 0 },
          { q: "She is a ___ dancer.", options: ["beautiful","beautifully","beauty","beautify"], correct: 0 },
          { q: "The ___ of the plan surprised everyone.", options: ["success","successful","successfully","succeed"], correct: 0 },
          { q: "The children listened ___.", options: ["quietly","quiet","quietness","quietly-ly"], correct: 0 } ] },
      { title: "6) Tenses (past simple vs present perfect)",
        rule: "Past simple: a finished action at a specific time (yesterday, in 2019). Present perfect: an action with no specific time, or with a link to now (ever, never, already, yet, since, for).",
        example: "I VISITED Paris in 2018. I HAVE visited Paris twice. (no time stated → present perfect)",
        mcqs: [
          { q: "We ___ the house last year.", options: ["bought","have bought","buy","are buying"], correct: 0 },
          { q: "She ___ to London three times.", options: ["has been","was","went","is going"], correct: 0 },
          { q: "I ___ my homework yet.", options: ["haven't finished","didn't finish","don't finish","wasn't finishing"], correct: 0 },
          { q: "They ___ in this city since 2015.", options: ["have lived","lived","live","are living"], correct: 0 } ] },
      { title: "7) Articles (a / an / the)",
        rule: "Use 'a' before a consonant sound, 'an' before a vowel sound (an hour, an honest man). Use 'the' for a specific or known thing. Use no article for general plurals and most uncountable nouns.",
        example: "I saw A dog. The dog was big. Dogs are loyal. (general plural, no article)",
        mcqs: [
          { q: "She is ___ honest person.", options: ["an","a","the","—"], correct: 0 },
          { q: "I'll meet you at ___ station.", options: ["the","a","an","—"], correct: 0 },
          { q: "___ sun rises in the east.", options: ["The","A","An","—"], correct: 0 },
          { q: "He is ___ university student.", options: ["a","an","the","—"], correct: 0 } ] },
      { title: "8) Pronouns (who / whom / which / that)",
        rule: "'Who' is for people as subject. 'Whom' is for people as object (often after a preposition). 'Which' is for things. 'That' can be used for people or things in defining clauses.",
        example: "The man WHO called you is here. The woman TO WHOM I spoke was kind. The book WHICH I read was long.",
        mcqs: [
          { q: "The student ___ won the prize is my friend.", options: ["who","which","whom","whose"], correct: 0 },
          { q: "The house ___ we bought is big.", options: ["which","who","whom","where"], correct: 0 },
          { q: "The girl with ___ I travelled is my cousin.", options: ["whom","who","which","what"], correct: 0 },
          { q: "This is the book ___ changed my life.", options: ["that","who","whom","where"], correct: 0 } ] },
      { title: "9) Modal Verbs (can / could / must / should)",
        rule: "Modals are followed by the base verb (no 'to', no -s). Can = ability/permission. Must = strong obligation. Should = advice. Must not = prohibition; don't have to = not necessary.",
        example: "You SHOULD sleep early. You MUST wear a seatbelt. You DON'T HAVE TO come today (it's optional).",
        mcqs: [
          { q: "You ___ smoke here. It is forbidden.", options: ["must not","don't have to","should","can"], correct: 0 },
          { q: "She ___ speak three languages.", options: ["can","cans","to can","is can"], correct: 0 },
          { q: "You look tired. You ___ rest.", options: ["should","shouldn't have","must to","are should"], correct: 0 },
          { q: "I ___ go to school tomorrow — it's a holiday.", options: ["don't have to","mustn't","shouldn't","can't to"], correct: 0 } ] }
    ]
  },
  {
    name: "Vocabulary",
    lessons: [
      { title: "10) Vocabulary (meaning & synonyms)",
        rule: "Pick the word closest in meaning; use the sentence for clues. Useful words: ambiguous = unclear, meticulous = very careful, pragmatic = practical.",
        example: "'The plan was ambiguous' = the plan was UNCLEAR. 'A meticulous worker' = a very CAREFUL worker.",
        mcqs: [
          { q: "'Meticulous' means ___.", options: ["very careful","very fast","very lazy","very rich"], correct: 0 },
          { q: "A synonym of 'happy' is ___.", options: ["joyful","angry","tired","afraid"], correct: 0 },
          { q: "'Diligent' is closest in meaning to ___.", options: ["hardworking","careless","sleepy","famous"], correct: 0 },
          { q: "'Reluctant' means ___.", options: ["unwilling","eager","confused","generous"], correct: 0 } ] },
      { title: "11) Antonyms (opposites)",
        rule: "An antonym is the word with the opposite meaning. Watch for prefixes: un-, in-, im-, dis- often make opposites (happy → unhappy, possible → impossible).",
        example: "'Generous' ↔ 'stingy'. 'Accept' ↔ 'reject'. 'Expand' ↔ 'shrink'.",
        mcqs: [
          { q: "The opposite of 'ancient' is ___.", options: ["modern","old","broken","huge"], correct: 0 },

/* ============================================================
   STATE & RENDERING
   ============================================================ */
const subjects = { english: englishSections, math: mathSections };
let currentSubject = 'english';
let currentSection = 0;
let userAnswers = {};

function activeSections(){ return subjects[currentSubject]; }
function activeLessons(){ return activeSections()[currentSection].lessons; }
function totalMcqs(){ let t=0; activeLessons().forEach(l=>t+=l.mcqs.length); return t; }

function switchSubject(sub){
  currentSubject = sub;
  currentSection = 0;
  document.body.className = (sub==='math') ? 'math-theme' : 'english-theme';
  document.getElementById('btnEnglish').classList.toggle('active', sub==='english');
  document.getElementById('btnMath').classList.toggle('active', sub==='math');
  renderTabs();
  resetQuiz();
}

function switchSection(i){
  currentSection = i;
  renderTabs();
  resetQuiz();
}

function renderTabs(){
  const box = document.getElementById('sectionTabs');
  box.innerHTML = '';
  activeSections().forEach((s, i)=>{
    const b = document.createElement('button');
    b.className = 'section-tab' + (i===currentSection ? ' active' : '');
    b.textContent = s.name;
    b.onclick = ()=> switchSection(i);
    box.appendChild(b);
  });
}

function initializeQuiz(){
  const area = document.getElementById('lessonsArea');
  area.innerHTML = '';
  activeLessons().forEach((lesson, li)=>{
    const card = document.createElement('div');
    card.className = 'lesson-card';
    let mcqHTML = '';
    lesson.mcqs.forEach((mcq, qi)=>{
      let opts = '';
      mcq.options.forEach((o, oi)=>{
        opts += `<label class="option"><input type="radio" name="q_${li}_${qi}" value="${oi}" onchange="selectAnswer('${li}_${qi}', ${oi}, this)"> ${o}</label>`;
      });
      mcqHTML += `<div class="mcq"><div class="mcq-q">Q${qi+1}. ${mcq.q}</div><div class="options">${opts}</div><div class="feedback" id="fb_${li}_${qi}"></div></div>`;
    });
    card.innerHTML = `
      <div class="lesson-section">${activeSections()[currentSection].name}</div>
      <div class="lesson-title">${lesson.title}</div>
      <div class="rule-title">THE RULE &amp; SMART EXPLANATION</div>
      <div class="rule-text">${lesson.rule}</div>
      <div class="example-title">EXAMPLE</div>
      <div class="example-text">${lesson.example}</div>
      <div class="practice-head">Now solve these ${lesson.mcqs.length} questions:</div>${mcqHTML}`;
    area.appendChild(card);
  });
  revealCards();
  updateProgress();
}

function selectAnswer(key, idx, input){
  userAnswers[key] = idx;
  if(input){
    const group = input.closest('.options');
    group.querySelectorAll('.option').forEach(o=>o.classList.remove('chosen'));
    input.closest('.option').classList.add('chosen');
  }
  updateProgress();
}

function updateProgress(){
  const total = totalMcqs();
  const answered = Object.keys(userAnswers).length;
  document.getElementById('progressFill').style.width = (total ? answered/total*100 : 0) + '%';
  document.getElementById('progressLabel').textContent = answered + ' of ' + total + ' answered';
  document.querySelector('.submit-btn').classList.toggle('ready', total > 0 && answered === total);
}

function submitQuiz(){
  let score = 0;
  const lessons = activeLessons();
  lessons.forEach((lesson, li)=>{
    lesson.mcqs.forEach((mcq, qi)=>{
      const key = li+'_'+qi;
      const fb = document.getElementById('fb_'+key);
      fb.classList.add('show');
      if(userAnswers[key] === mcq.correct){
        score++;
        fb.className = 'feedback show correct';
        fb.innerHTML = '<div class="feedback-message">&#9989; Correct!</div>';
      } else {
        fb.className = 'feedback show incorrect';
        fb.innerHTML = '<div class="feedback-message">&#10060; Not quite</div><div>Correct answer: <strong>' + mcq.options[mcq.correct] + '</strong></div>';
      }
    });
  });

  document.getElementById('quizContainer').style.display = 'none';
  document.getElementById('resultsSection').classList.add('show');
  const total = totalMcqs();
  countUp(document.getElementById('scoreDisplay'), score, total, 900);
  const pct = total ? score/total*100 : 0;
  let msg;
  if(pct === 100) msg = '&#127775; Perfect score — outstanding work, Mariam!';
  else if(pct >= 75) msg = '&#127942; Excellent — keep up the momentum!';
  else if(pct >= 50) msg = 'Good start — review the rules and try again.';
  else msg = 'Read each Rule & Example again, then retry.';
  document.getElementById('scoreMessage').innerHTML = msg + ' (' + pct.toFixed(0) + '%)';

  let rows = '';
  lessons.forEach((lesson, li)=>{
    let s = 0;
    lesson.mcqs.forEach((mcq, qi)=>{ if(userAnswers[li+'_'+qi] === mcq.correct) s++; });
    rows += `<div class="breakdown-row" style="animation-delay:${(0.25 + li*0.08).toFixed(2)}s"><span>${lesson.title}</span><span class="bar">${s}/${lesson.mcqs.length}</span></div>`;
  });
  document.getElementById('breakdown').innerHTML = rows;
  window.scrollTo({top:0, behavior:'smooth'});
}

function resetQuiz(){
  userAnswers = {};
  document.getElementById('quizContainer').style.display = 'block';
  document.getElementById('resultsSection').classList.remove('show');
  initializeQuiz();
}

/* ============================================================
   ANIMATION HELPERS
   ============================================================ */
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* one-shot spin when the avatar is clicked */
function spinAvatar(el){
  el.classList.remove('spin');
  void el.offsetWidth;          /* force reflow so the animation can replay */
  el.classList.add('spin');
}

/* fade each lesson card in as it scrolls into view, slightly staggered */
function revealCards(){
  const cards = document.querySelectorAll('.lesson-card');
  const showAll = ()=> cards.forEach(c=>c.classList.add('revealed'));

  /* no animation wanted, or no observer support -> just show the lessons */
  if(reduceMotion || !('IntersectionObserver' in window)){ showAll(); return; }

  const list = [...cards];
  const io = new IntersectionObserver((entries, obs)=>{
    entries.forEach(e=>{
      if(!e.isIntersecting) return;
      const i = list.indexOf(e.target);
      setTimeout(()=> e.target.classList.add('revealed'), Math.min(i, 4) * 90);
      obs.unobserve(e.target);
    });
  }, { rootMargin: '0px 0px -60px 0px', threshold: 0 });   /* 0: lesson cards are taller than the viewport */
  cards.forEach(c=>io.observe(c));

  /* safety net: never leave lesson content stuck invisible if the observer
     does not fire (hidden tab, odd layout, throttled background render) */
  setTimeout(()=>{
    list.forEach(c=>{
      if(!c.classList.contains('revealed') &&
         c.getBoundingClientRect().top < window.innerHeight) c.classList.add('revealed');
    });
  }, 1200);
}

/* count the score up instead of snapping straight to it */
function countUp(el, to, total, duration){
  if(reduceMotion){ el.textContent = to + '/' + total; return; }
  const t0 = performance.now();
  (function frame(now){
    const p = Math.min(1, (now - t0) / duration);
    const eased = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(to * eased) + '/' + total;
    if(p < 1) requestAnimationFrame(frame);
  })(t0);
}

/* hearts, stars and flowers drifting up behind the page */
function buildDecor(){
  if(reduceMotion) return;
  const box = document.getElementById('decor');
  const glyphs = ['\u{1F497}', '\u2B50', '\u{1F338}', '\u{1F49B}', '\u2728'];
  for(let i = 0; i < 16; i++){
    const s = document.createElement('span');
    s.textContent = glyphs[i % glyphs.length];
    s.style.left = (Math.random() * 100) + '%';
    s.style.fontSize = (15 + Math.random() * 20).toFixed(0) + 'px';
    s.style.animationDuration = (17 + Math.random() * 16).toFixed(1) + 's';
    s.style.animationDelay = (-Math.random() * 30).toFixed(1) + 's';
    s.style.opacity = (0.35 + Math.random() * 0.35).toFixed(2);
    box.appendChild(s);
  }
}

buildDecor();
renderTabs();
initializeQuiz();
</script>
