<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mariam's EST1 Lessons - English & Math</title>
<meta name="description" content="EST1 preparation for Mariam: 64 English and Math lessons taught as Rule, Example and Practice, with instant feedback, saved progress and a review list.">
<meta name="theme-color" content="#1b1a2e">
<meta name="color-scheme" content="light dark">
<meta property="og:type" content="website">
<meta property="og:title" content="Mariam's EST1 Lessons - English &amp; Math">
<meta property="og:description" content="64 lessons, 256 practice questions, instant feedback and saved progress.">
<meta property="og:image" content="/avatar.webp">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="/avatar.webp">
<link rel="icon" type="image/webp" href="/avatar.webp">
<link rel="apple-touch-icon" href="/avatar.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/src/styles.css">
</head>
<body class="english-theme">

<div class="decor" id="decor" aria-hidden="true"></div>

<div class="wrap">

  <header class="topbar">
    <div class="brand">
      <img id="avatar" src="/avatar.webp" alt="" width="46" height="46">
      <div class="brand-text">
        <div class="brand-name">Mariam&#39;s <span>EST1</span></div>
        <div class="brand-sub">Rule &middot; Example &middot; Practice</div>
      </div>
    </div>
    <div class="topbar-actions">
      <div class="mode-switch" role="group" aria-label="Study mode">
        <button id="modeLearn" type="button" aria-pressed="true">Learn</button>
        <button id="modeTest"  type="button" aria-pressed="false">Test</button>
      </div>
      <button id="callBtn"  class="icon-btn" type="button" aria-label="Start a study call" title="Study together">&#128249;</button>
      <button id="themeBtn" class="icon-btn" type="button" aria-label="Switch colour theme">&#9790;</button>
    </div>
  </header>

  <section class="overall" aria-label="Overall progress">
    <div class="overall-top">
      <span class="overall-label" id="overallLabel">Progress</span>
      <span class="overall-stat" id="overallStat"></span>
    </div>
    <div class="meter"><div class="meter-fill" id="overallFill"></div></div>
  </section>

  <main id="main"></main>

</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<noscript>
  <div class="wrap"><div class="panel">
    <div class="panel-title">JavaScript is switched off</div>
    <div class="panel-sub">These lessons need JavaScript to show the questions and track your progress. Please turn it on and reload.</div>
  </div></div>
</noscript>

<script src="/src/data.js"></script>
<script src="/src/app.js"></script>
<script src="/src/call.js"></script>
<script src="/src/teach.js"></script>
</body>
</html>
